<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 292" role="img" aria-labelledby="t d"><title id="t">One-man fighting position — section</title><desc id="d">Cut-through view of the excavation from the side, showing depth and wall lean.</desc><rect x="0" y="0" width="352" height="292" fill="#ffffff"/><path d="M 0 56 L 56 56 L 96 176 L 256 176 L 296 56 L 352 56 L 352 292 L 0 292 Z" fill="#e8dcc8" stroke="#1a1c1e" stroke-width="1.5"/><line x1="0" y1="56" x2="352" y2="56" stroke="#4a4f54" stroke-width="2"/><text x="6" y="50" fill="#5b6167" font-size="12" font-family="sans-serif">GROUND</text><line x1="96" y1="194" x2="256" y2="194" stroke="#8a4b0f" stroke-width="1"/><rect x="106" y="172" width="140" height="18" fill="#f3e8d2" stroke="#8a4b0f" stroke-width="0.75" rx="4"/><text x="176" y="185" fill="#8a4b0f" font-size="12" font-family="sans-serif" text-anchor="middle">⟨how far back the hole runs⟩</text><line x1="318" y1="56" x2="318" y2="176" stroke="#8a4b0f" stroke-width="1"/><rect x="322" y="107" width="140" height="18" fill="#f3e8d2" stroke="#8a4b0f" stroke-width="0.75" rx="4"/><text x="392" y="120" fill="#8a4b0f" font-size="12" font-family="sans-serif" text-anchor="middle">⟨how deep you dig⟩</text><text x="176" y="258" fill="#b3261e" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">NO SCALE — TEMPLATE</text><text x="176" y="274" fill="#b3261e" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">DO NOT SCALE — proportions are arbitrary and identical for every case</text><text x="176" y="286" fill="#5b6167" font-size="11" font-family="sans-serif" text-anchor="middle">SLICED VIEW — shows the inside</text></svg>