<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 418" role="img" aria-labelledby="t d"><title id="t">One-man fighting position — plan</title><desc id="d">Top-down view: the black band points at the enemy; the outer line is the top of the hole, the dashed line is the floor.</desc><rect x="0" y="0" width="312" height="418" fill="#ffffff"/><rect x="0" y="8" width="312" height="26" fill="#000000"/><text x="126" y="25" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle" font-weight="bold">ENEMY THIS WAY</text><line x1="200" y1="13" x2="210" y2="29" stroke="#ffffff" stroke-width="2.5"/><line x1="210" y1="13" x2="220" y2="29" stroke="#ffffff" stroke-width="2.5"/><line x1="220" y1="13" x2="230" y2="29" stroke="#ffffff" stroke-width="2.5"/><rect x="56" y="78" width="200" height="240" fill="#c9b895" stroke="#1a1c1e" stroke-width="1.5"/><rect x="96" y="118" width="120" height="160" fill="#e8dcc8" stroke="#1a1c1e" stroke-width="1" stroke-dasharray="5 3"/><text x="102" y="134" fill="#5b6167" font-size="11" font-family="sans-serif">floor (walls lean back to the outer line)</text><line x1="96" y1="344" x2="216" y2="344" stroke="#8a4b0f" stroke-width="1"/><rect x="86" y="322" width="140" height="18" fill="#f3e8d2" stroke="#8a4b0f" stroke-width="0.75" rx="4"/><text x="156" y="335" fill="#8a4b0f" font-size="12" font-family="sans-serif" text-anchor="middle">⟨how wide the hole is toward the enemy⟩</text><text x="156" y="410" fill="#b3261e" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">NO SCALE — TEMPLATE</text></svg>