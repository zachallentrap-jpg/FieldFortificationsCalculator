# TIMBER-2 T0 item (1) — the machine behind "the suites stay green" and "the deploy
# stays green", which every phase of every plan lists as acceptance.
#
# This exists because a broken deploy was previously discovered by clicking Republish
# and reading a red banner. Now it is discovered here, on the commit that caused it,
# with the failing step named.
name: toolkit
on:
  push:
    paths: ['src/**', 'test/**', 'scripts/**', 'sap2/**', 'package.json', 'package-lock.json', 'vite*.ts', '.github/workflows/toolkit.yml']
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'sap2/**', 'package.json', 'package-lock.json', 'vite*.ts', '.github/workflows/toolkit.yml']

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: sap2/.nvmrc   # 22.x — the suite build's floor (vite 8)
          cache: npm

      - name: Install (root)
        run: npm ci

      # Typecheck + full node suite + the offline gate.
      - name: Verify
        run: npm run verify

      # The deploy path itself: hub + TIMBER-1 + SAP-2 assembled exactly as Replit does.
      # This is the step that would have caught the OOM and the Node-20 pin.
      - name: Build the deployed suite
        run: npm run build:suite

      # No unexplained file may enter dist/ (and no allowlisted asset may vanish).
      - name: Check dist assets
        run: npm run check:assets

  sap2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sap2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: sap2/.nvmrc
          cache: npm
          cache-dependency-path: sap2/package-lock.json
      - run: npm ci
      # SAP-2's own gates: typecheck, G-1..G-13 + G-16, and its single-file artifact.
      - run: npm run verify
